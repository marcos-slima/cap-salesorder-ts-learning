# ═══════════════════════════════════════════════════════════════════
#  FILE  : _i18n/i18n.properties
#  LAYER : i18n — Default (English) label bundle
#
#  CAP resolves labels at runtime from the Accept-Language header.
#  Add _i18n/i18n_pt_BR.properties for Portuguese (Brazil) labels.
#  Add _i18n/i18n_de.properties    for German labels.
#
#  Keys must match the {i18n>...} tokens used in CDS entity annotations.
#  Example: @title: '{i18n>SalesOrder}' → key 'SalesOrder' below.
# ═══════════════════════════════════════════════════════════════════

# ── Service titles ────────────────────────────────────────────────
SalesOrderService=Sales Orders
SalesCatalogService=Sales Catalog
SalesAnalyticsService=Sales Analytics

# ── Entity labels ─────────────────────────────────────────────────
SalesOrder=Sales Order
SalesOrderItem=Sales Order Item
ScheduleLine=Schedule Line
SalesOrderPartner=Partner Function
SalesOrderHeaderText=Header Text
SalesOrderItemText=Item Text

# ── Field labels ──────────────────────────────────────────────────
SalesOrderNumber=Sales Order
ItemNumber=Item
OrderDate=Order Date
RequestedDeliveryDate=Requested Delivery Date
NetAmount=Net Amount
TransactionCurrency=Currency
OrderQuantity=Order Quantity
OrderQuantityUnit=Unit of Measure
DeliveryDate=Delivery Date

# ── Status labels ─────────────────────────────────────────────────
OverallOrderStatus=Overall Status
DeliveryStatus=Delivery Status
BillingStatus=Billing Status

# Overall Status enum values
OverallOrderStatus_A=Open
OverallOrderStatus_B=In Process
OverallOrderStatus_C=Completed
OverallOrderStatus_blank=Not Relevant

# Delivery Status enum values
DeliveryStatus_A=Not Delivered
DeliveryStatus_B=Partially Delivered
DeliveryStatus_C=Fully Delivered
DeliveryStatus_blank=Not Relevant

# Billing Status enum values
BillingStatus_A=Not Billed
BillingStatus_B=Partially Billed
BillingStatus_C=Fully Billed
BillingStatus_blank=Not Relevant

# ── Action labels (for Fiori buttons) ─────────────────────────────
submitOrder=Submit Order
confirmDelivery=Confirm Delivery
recalculatePricing=Recalculate Pricing
logicalDelete=Delete Order
addToDelivery=Add to Delivery

# ── Validation messages ───────────────────────────────────────────
ERR_DELVDATE_BEFORE_ORDDATE=Requested delivery date cannot be earlier than the order date.
ERR_PARTNER_BLOCKED=Business partner {0} is blocked. Release the block before using this partner.
ERR_NO_SOLDTO=A sold-to partner (function AG) is required before submission.
ERR_MISSING_SCHEDULE_LINES=Items {0} have no delivery schedule lines. Add at least one schedule line per item.
ERR_ALREADY_SUBMITTED=Order {0} is already in status '{1}'. Only Open orders can be submitted.
ERR_ALREADY_DELIVERED=Order {0} is already fully delivered.
ERR_ALREADY_DELETED=Order {0} is already logically deleted.
ERR_NO_HARD_DELETE=Physical DELETE is not permitted. Use the logicalDelete action.
ERR_ORDER_DELETED=Sales order {0} is logically deleted and cannot be modified.
