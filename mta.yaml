_schema-version: '3.1'
ID: cap-salesorder-ts-simple
version: 1.0.0
description: SAP CAP Sales Order domain — validacao single-tenant simplificada

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --production=false
        - npm run build

modules:
  - name: cap-salesorder-ts-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cap-salesorder-db
      - name: cap-salesorder-auth
    properties:
      SAP_CDS_LOG_FORMAT: json
      NODE_ENV: production
      CDS_REQUIRES_MESSAGING_KIND: file-based-messaging

  - name: cap-salesorder-ts-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    requires:
      - name: cap-salesorder-db

resources:
  - name: cap-salesorder-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  - name: cap-salesorder-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: cap-salesorder-ts-simple-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          tokenValidity: 43200
          refreshTokenValidity: 86400
          grant-types:
            - client_credentials
            - authorization_code
